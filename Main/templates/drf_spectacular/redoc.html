<!DOCTYPE html>
<html>
<head>
  <title>{{ title|default:"API Docs" }}</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style nonce="{{ request.csp_nonce }}">body { margin: 0; padding: 0; }</style>
</head>
<body>
  <div id="redoc"></div>
  <script nonce="{{ request.csp_nonce }}" src="{{ redoc_standalone }}"></script>
  <script nonce="{{ request.csp_nonce }}">
    Redoc.init(
      "{{ schema_url }}",
      Object.assign({{ settings|safe }}, { nonce: "{{ request.csp_nonce }}" }),
      document.getElementById("redoc")
    );
  </script>
</body>
</html>
